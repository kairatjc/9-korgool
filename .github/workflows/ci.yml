name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Pixel comparison with the design handoff + functional checks of the web client (docs/design/handoff.md §3).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @korgool/web exec playwright install --with-deps chromium
      - run: pnpm --filter @korgool/web test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Образы для деплоя собираются, сервер из образа отвечает на /health (docs/deploy.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target server -t korgool-server .
      - run: docker build --target web -t korgool-web .
      - name: Server image starts
        run: |
          docker run -d --name server -p 3000:3000 korgool-server
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/health && exit 0; sleep 1; done
          docker logs server && exit 1
