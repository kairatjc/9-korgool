name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Настоящий Redis для теста хранилища партий (apps/server/test/store.test.ts).
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Pixel comparison with the design handoff + functional checks of the web client (docs/design/handoff.md §3).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @korgool/web exec playwright install --with-deps chromium
      - run: pnpm --filter @korgool/web test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Образы для деплоя собираются, сервер из образа отвечает на /health (docs/deploy.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target server -t korgool-server .
      - run: docker build --target web -t korgool-web .
      - name: Server image starts and migrates the database
        run: |
          docker network create korgool
          docker run -d --name db --network korgool -e POSTGRES_USER=korgool -e POSTGRES_PASSWORD=ci postgres:16-alpine
          docker run -d --name valkey --network korgool valkey/valkey:8-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U korgool && break; sleep 1; done
          docker run -d --name server --network korgool -p 3000:3000 \
            -e DATABASE_URL=postgres://korgool:ci@db:5432/korgool \
            -e REDIS_URL=redis://valkey:6379 \
            -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            korgool-server
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then
              curl -fsS -X POST -H 'content-type: application/json' -H 'origin: http://localhost:5173' \
                -d '{}' http://localhost:3000/api/auth/sign-in/anonymous && exit 0
              break
            fi
            sleep 1
          done
          docker logs server && exit 1
